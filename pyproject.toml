[tool.poetry]
name = "gnome-launcher"
version = "0.1.0"
description = "Event-driven strategy launch orchestration"
packages = [{include = "launcher"}]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
# live-data: the cs2 scanner reads gnome-pipelines' datasets through gnomepy.data.
gnomepy = {version = "^2.24.0", extras = ["live-data"]}
boto3 = "*"
requests = "*"
anthropic = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
moto = {version = "*", extras = ["sqs", "sns", "dynamodb", "secretsmanager"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
